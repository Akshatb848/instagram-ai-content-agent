[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "instagram-ai-content-agent"
version = "0.1.0"
description = "Zero-cost-first, human-approved AI Reel pipeline"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.4",
  "feedparser==6.0.11",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.42",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
  "types-requests==2.32.4.20250611",
]

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=instagram_agent --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["instagram_agent"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
omit = [
  "src/instagram_agent/models.py",
  "src/instagram_agent/db.py",
]
